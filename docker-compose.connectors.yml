services:
  n8n:
    build:
      context: .
      dockerfile: infrastructure/docker/n8n-connectors.Dockerfile
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      BBD_SOURCE_ID: ${BBD_SOURCE_ID:-}
      CONNECTOR_API_IP: 172.29.250.10
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    cap_add: ["NET_ADMIN"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    networks:
      - connectors_internal
      - n8n_egress
    restart: unless-stopped

  browser:
    build:
      context: .
      dockerfile: infrastructure/docker/browser.Dockerfile
    environment:
      BROWSER_SHARED_TOKEN: ${BROWSER_SHARED_TOKEN:-}
    expose: ["8001"]
    cap_add: ["NET_ADMIN"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - connectors_internal
      - browser_egress

  api:
    environment:
      N8N_SERVICE_URL: ${N8N_SERVICE_URL:-http://n8n:5678}
      BBD_SOURCE_ID: ${BBD_SOURCE_ID:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
    networks:
      default: {}
      connectors_internal:
        ipv4_address: 172.29.250.10

  worker:
    networks:
      - default
      - connectors_internal

volumes:
  n8n-data:

networks:
  connectors_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.29.250.0/24
  browser_egress:
    driver: bridge
  n8n_egress:
    driver: bridge
