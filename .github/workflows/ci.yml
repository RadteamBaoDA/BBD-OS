name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff check core apps modules tests infrastructure/postgres/migrations
      - run: uv run mypy core apps modules
      - run: npm run lint
      - run: npm run typecheck
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'EOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          OMNIROUTE_BASE_URL=
          OMNIROUTE_API_KEY=
          EOF
      - name: Run backend and browser acceptance on disposable Compose stack
        run: make test
      - name: Build frontend and production containers
        run: make build
